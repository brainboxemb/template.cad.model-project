name: Pages

on:
  pull_request:
    branches: [dev, main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "modules/pages/**"
      - "models/**/model.yml"
      - "models/**/page.md"
      - "models/**/*.svg"
      - "models/**/*.png"
      - "models/**/*.jpg"
      - "models/**/*.jpeg"
      - "models/**/*.webp"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: pages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out build output
        uses: actions/checkout@v7
        with:
          ref: build
          path: prepared-build
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pages runtime dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Build and verify Pages
        env:
          PYTHONPATH: modules/pages/src
        run: >-
          python -m cad_model_pages.build
          --source-root .
          --build-scope prepared-build/main
          --destination generated-site
          --base-url "https://brainboxemb.github.io/template.cad.model-project/"
          --source-ref "${{ github.event.pull_request.head.sha }}"

  assemble:
    name: pages-build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out stable source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source-main
          fetch-depth: 1
          persist-credentials: false

      - name: Check out development source
        uses: actions/checkout@v7
        with:
          ref: dev
          path: source-dev
          fetch-depth: 1
          persist-credentials: false

      - name: Check out build output
        uses: actions/checkout@v7
        with:
          ref: build
          path: prepared-build
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pages runtime dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Build stable site
        env:
          PYTHONPATH: source-main/modules/pages/src
        run: >-
          python -m cad_model_pages.build
          --source-root source-main
          --build-scope prepared-build/main
          --destination generated-site
          --base-url "https://brainboxemb.github.io/template.cad.model-project/"
          --source-ref main

      - name: Build development site
        env:
          PYTHONPATH: source-dev/modules/pages/src
        run: >-
          python -m cad_model_pages.build
          --source-root source-dev
          --build-scope prepared-build/dev
          --destination generated-site/dev
          --base-url "https://brainboxemb.github.io/template.cad.model-project/dev/"
          --source-ref dev

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: generated-site

  deploy:
    name: pages-deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
