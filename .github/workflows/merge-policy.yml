name: Merge policy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  merge:
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.body == '/merge' ||
       startsWith(github.event.comment.body, '/merge-resolved'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Check out policy source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Bootstrap merge-policy module
        run: python -m pip install -e modules/merge-policy

      - name: Execute repository merge policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m cad_model_merge_policy
          --repository "${{ github.repository }}"
          --pull-request-number "${{ github.event.issue.number }}"
          --actor "${{ github.actor }}"
          --repository-owner "${{ github.repository_owner }}"
