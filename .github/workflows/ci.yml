name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact Forge release
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/brainboxemb/lib.py.solidcraft.forge.git@ea5710a5d2d33b0633b93c5da95dd5b74f126aa4#subdirectory=scpf"

      - name: Build simple-box
        run: |
          mkdir -p build/models/simple-box
          python -m scpf models/simple-box/scpf/model.py \
            --out build/models/simple-box/solidcraft.json
          python -m json.tool build/models/simple-box/solidcraft.json >/dev/null
          test -s build/models/simple-box/solidcraft.json
