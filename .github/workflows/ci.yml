name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install CI runtime dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Run selected project items
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: modules/ci/src
        run: python -m cad_model_ci

      - name: Check out durable build evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: build
          path: prepared-build
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.x"
          cache: false

      - name: Set up pinned Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Build and verify model Pages
        env:
          HUGO_BASEURL: https://brainboxemb.github.io/template.cad.model-project/
          HUGO_PARAMS_SOURCEREF: ${{ github.event.pull_request.head.sha }}
        run: |
          cd site
          hugo mod graph | grep -F "github.com/imfing/hextra@v0.13.0"
          hugo --minify --printPathWarnings --destination "$GITHUB_WORKSPACE/generated-site"
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=modules/pages/src python -m cad_model_pages.verify \
            --repo . \
            --site generated-site \
            --build-scope prepared-build/main

  durable:
    name: durable
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install CI runtime dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Run selected project items
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: modules/ci/src
        run: python -m cad_model_ci

      - name: Publish durable build scope
        env:
          PYTHONPATH: modules/build/src
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          plan="build/$SOURCE_REF/build-plan.json"
          if [ ! -s "$plan" ]; then
            echo "No model build plan for $SOURCE_REF; build branch unchanged"
            exit 0
          fi

          publish_args=()
          if [ "$SOURCE_REF" = "main" ]; then
            publish_args+=(--full)
          fi

          python -m cad_model_build.publish \
            --repo . \
            --namespace "$SOURCE_REF" \
            --source-ref "$SOURCE_REF" \
            --source-sha "$SOURCE_SHA" \
            "${publish_args[@]}"

      - name: Check out durable stable build evidence
        if: github.ref_name == 'main'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: build
          path: prepared-build
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go for Pages
        if: github.ref_name == 'main'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.x"
          cache: false

      - name: Set up pinned Hugo for Pages
        if: github.ref_name == 'main'
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Build stable Pages
        if: github.ref_name == 'main'
        env:
          HUGO_BASEURL: https://brainboxemb.github.io/template.cad.model-project/
          HUGO_PARAMS_SOURCEREF: ${{ github.sha }}
        run: |
          cd site
          hugo mod graph | grep -F "github.com/imfing/hextra@v0.13.0"
          hugo --minify --printPathWarnings --destination "$GITHUB_WORKSPACE/generated-site"
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=modules/pages/src python -m cad_model_pages.verify \
            --repo . \
            --site generated-site \
            --build-scope prepared-build/main

      - name: Publish stable Pages branch
        if: github.ref_name == 'main'
        env:
          PYTHONPATH: modules/pages/src
        run: >-
          python -m cad_model_pages.publish
          --repo .
          --site generated-site
          --source-ref main
          --source-sha "${{ github.sha }}"
