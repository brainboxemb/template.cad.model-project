[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-model-project"
version = "0.1.0"
description = "Local tooling for a self-contained CAD model project"
requires-python = ">=3.12"
dependencies = [
  "PyYAML==6.0.2",
]

[tool.setuptools.packages.find]
include = ["cad_project*"]
